<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md border border-slate-200">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Student Grade Calculator</h2>
    
    <form id="gradeForm" class="space-y-4">
      <div>
        <label for="sub1" class="block text-sm font-medium text-slate-700 mb-1">Subject 1 (Max 100):</label>
        <input type="number" id="sub1" min="0" max="100" placeholder="Enter marks" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <div>
        <label for="sub2" class="block text-sm font-medium text-slate-700 mb-1">Subject 2 (Max 100):</label>
        <input type="number" id="sub2" min="0" max="100" placeholder="Enter marks" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <div>
        <label for="sub3" class="block text-sm font-medium text-slate-700 mb-1">Subject 3 (Max 100):</label>
        <input type="number" id="sub3" min="0" max="100" placeholder="Enter marks" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <div>
        <label for="sub4" class="block text-sm font-medium text-slate-700 mb-1">Subject 4 (Max 100):</label>
        <input type="number" id="sub4" min="0" max="100" placeholder="Enter marks" required
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <button type="submit" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200">
        Calculate Grade
      </button>
    </form>

    <!-- Dynamic Output Box -->
    <div id="result" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium space-y-1"></div>
  </div>

  <script>
    document.getElementById('gradeForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevents full page reload

      // Read and parse input values
      const m1 = parseFloat(document.getElementById('sub1').value);
      const m2 = parseFloat(document.getElementById('sub2').value);
      const m3 = parseFloat(document.getElementById('sub3').value);
      const m4 = parseFloat(document.getElementById('sub4').value);
      
      const resultDiv = document.getElementById('result');
      const marks = [m1, m2, m3, m4];

      // Validation
      const isInvalid = marks.some(m => isNaN(m) || m < 0 || m > 100);
      if (isInvalid) {
        resultDiv.className = 'mt-6 p-4 rounded-xl text-center text-sm font-medium bg-amber-100 text-amber-800 border border-amber-300';
        resultDiv.textContent = 'Please enter valid marks between 0 and 100 for all subjects.';
        resultDiv.classList.remove('hidden');
        return;
      }

      // Calculations
      const total = m1 + m2 + m3 + m4;
      const percentage = (total / 400) * 100;
      let grade = '';
      let isPass = true;

      // Grade allocation ladder
      if (percentage >= 85) {
        grade = 'A+';
      } else if (percentage >= 70) {
        grade = 'A';
      } else if (percentage >= 60) {
        grade = 'B';
      } else if (percentage >= 50) {
        grade = 'C';
      } else if (percentage >= 40) {
        grade = 'D';
      } else {
        grade = 'F';
        isPass = false;
      }

      // Render output with dynamic Tailwind classes
      resultDiv.className = isPass 
        ? 'mt-6 p-4 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-300 space-y-1' 
        : 'mt-6 p-4 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-800 border border-rose-300 space-y-1';

      resultDiv.innerHTML = `
        <p><span class="font-bold">Total Marks:</span> ${total} / 400</p>
        <p><span class="font-bold">Percentage:</span> ${percentage.toFixed(2)}%</p>
        <p><span class="font-bold">Grade:</span> ${grade}</p>
        <p><span class="font-bold">Status:</span> ${isPass ? 'PASS' : 'FAIL'}</p>
      `;
      resultDiv.classList.remove('hidden');
    });
  </script>
</body>
</html>
